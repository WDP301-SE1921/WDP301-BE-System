services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wdp301
      POSTGRES_USER: wdp301
      POSTGRES_PASSWORD: local_only_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wdp301 -d wdp301']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
